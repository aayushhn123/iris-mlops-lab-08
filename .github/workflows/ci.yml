name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python train.py
      - run: pytest -q
      - name: Build Docker image
        run: docker build -t iris-mlops:${{ github.sha }} .
