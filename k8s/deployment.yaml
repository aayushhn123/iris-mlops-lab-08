apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris-app
spec:
  replicas: 2
  selector:
    matchLabels: {app: iris-app}
  template:
    metadata:
      labels: {app: iris-app}
    spec:
      containers:
        - name: iris-app
          image: iris-mlops:latest
          imagePullPolicy: IfNotPresent
          ports:
            - {containerPort: 8501, name: web}
            - {containerPort: 8000, name: metrics}
---
apiVersion: v1
kind: Service
metadata:
  name: iris-service
spec:
  type: NodePort
  selector: {app: iris-app}
  ports:
    - {name: web, port: 8501, targetPort: 8501, nodePort: 30501}
    - {name: metrics, port: 8000, targetPort: 8000, nodePort: 30800}
